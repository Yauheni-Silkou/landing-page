<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Academy - Courses</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    const savedTheme = localStorage.getItem('app-theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>

  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="header__logo" aria-label="Language Academy Home">
        <img src="./assets/img/logo.png" alt="Language Academy logo" class="header__logo-img">
        <span class="header__logo-text">Language Academy</span>
      </a>
      
      <nav class="header__nav">
        <ul class="header__nav-list">
          <li><a href="index.html#hero" class="header__nav-link">Home</a></li>
          <li><a href="index.html#testimonials" class="header__nav-link">Stories</a></li>
          <li><a href="index.html#benefits" class="header__nav-link">Why Us</a></li>
          <li><a href="catalog.html" class="header__nav-link">Courses</a></li>
        </ul>
      </nav>

      <div class="header__controls">
        <button id="theme-btn" class="theme-toggle" aria-label="Toggle display theme">
          <svg class="theme-icon theme-icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin='round'>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon theme-icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <button class="burger-btn burger-toggle" aria-label="Open mobile navigation menu" aria-expanded="false">
          <span class="burger-btn__line"></span>
          <span class="burger-btn__line"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="catalog">
      <div class="container catalog__container">
        <h1 class="catalog__title">Explore Our <em>Language Courses</em></h1>

        <div class="catalog__categories">
          <button class="category-btn active" data-category="english">
            <img class="category-btn--flag" src="./assets/img/flags/flag-uk.jpg" alt="Flag of United Kingdom">
            English
          </button>
          <button class="category-btn" data-category="spanish">
            <img class="category-btn--flag" src="./assets/img/flags/flag-spain.jpg" alt="Flag of Spain">
            Spanish
          </button>
          <button class="category-btn" data-category="japanese">
            <img class="category-btn--flag" src="./assets/img/flags/flag-japan.jpg" alt="Flag of Japan">
            Japanese
          </button>
          <button class="category-btn" data-category="polish">
            <img class="category-btn--flag" src="./assets/img/flags/flag-poland.jpg" alt="Flag of Poland">
            Polish
          </button>
        </div>

        <div class="catalog__grid"></div>
        <div class="catalog__pagination">
          <button class="btn btn--secondary" id="load-more-btn">View More Tiers</button>
        </div>

      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container footer__container">
      <div class="footer__info">
        <h2 class="footer__title">Connect with admissions</h2>
        <a href="tel:+1234567890" class="footer__link">Admissions: +1 (234) 567-890</a>
        <a href="https://www.google.com/maps/place/Big+Ben/@51.5007325,-0.1272003,17z/data=!3m2!4b1!5s0x47d8e55e300273ad:0x64ade3f4995c75cd!4m6!3m5!1s0x487604c38c8cd1d9:0xb78f2474b9a45aa9!8m2!3d51.5007292!4d-0.1246254!16zL20vMDI2eWRj?entry=ttu&g_ep=EgoyMDI2MDkyMC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" class="footer__link">Main Campus: 456 Education Way</a>
      </div>
      <div class="footer-links">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">
          <img src="./assets/img/footer/github-logo.png" alt="GitHub">
        </a>
        <a href="https://rs.school" target="_blank" rel="noopener noreferrer">
          <img src="./assets/img/footer/rs-school-logo.png" alt="RS School Preschool">
        </a>
        <a href="https://rs.school" target="_blank" rel="noopener noreferrer">
          <img src="./assets/img/footer/rs-school-label.svg" alt="RS School JS Course">
        </a>
      </div>
      <div class="footer-year">© 2026</div>
    </div>
  </footer>

  <div class="modal-overlay" id="course-modal">
    <div class="modal-container">
      <button class="modal-close" aria-label="Close modal window">&times;</button>
      <div id="modal-dynamic-content">
      </div>
    </div>
  </div>

  <script src="./js/theme.js"></script>
  <script src="./js/catalog.js"></script>
</body>
</html>
